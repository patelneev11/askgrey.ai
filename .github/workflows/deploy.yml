name: Deploy

# One image, one service, one origin: the container built here serves both the API and the SPA
# (see Dockerfile), and ECS rolls it behind the load balancer. Credentials are an OIDC role
# assumed per run — there is no AWS key in this repository. Infrastructure is in infra/aws and
# is applied by hand; this workflow only ships code onto it. See docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the OIDC token that stands in for an access key

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'askgrey' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'askgrey' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'askgrey' }}
      ECS_CONTAINER: app
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      # No role configured means the infrastructure does not exist yet; say so rather than
      # failing with an opaque credentials error.
      - name: Check the deploy role is configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is unset. Apply infra/aws and set it from the github_deploy_role_arn output."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Tagged by commit so a rollback names a specific build rather than "whatever latest was".
      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Take the definition the service is running, swap only the image, and register that.
      # Everything else — the secret ARNs, the environment, the roles — stays where Terraform
      # put it, so a deploy cannot silently change the app's configuration.
      - name: Register the task definition
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition' > /tmp/current.json
          python3 - <<'PY'
          import json, os

          definition = json.load(open("/tmp/current.json"))
          for field in (
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy", "deregisteredAt",
          ):
              definition.pop(field, None)
          image = os.environ["IMAGE"]
          release = os.environ["GITHUB_SHA"]
          for container in definition["containerDefinitions"]:
              if container["name"] == os.environ["ECS_CONTAINER"]:
                  container["image"] = image
                  container["environment"] = [
                      variable for variable in container.get("environment", [])
                      if variable["name"] != "RELEASE"
                  ] + [{"name": "RELEASE", "value": release}]
          json.dump(definition, open("/tmp/next.json", "w"))
          PY
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ steps.image.outputs.image }}

      # The service's circuit breaker rolls back a task that fails its migration or its health
      # check, and `wait services-stable` is what turns that rollback into a failed run.
      - name: Roll the service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      # A rolled service and a service that is answering are different claims.
      - name: Verify the deployment answers
        if: env.HEALTHCHECK_URL != ''
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL" | grep -q '"status":"ok"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::production did not report healthy at $HEALTHCHECK_URL within 5 minutes."
          exit 1

      - name: Report what was skipped
        if: always()
        run: |
          [ -n "$HEALTHCHECK_URL" ] || echo "::warning::HEALTHCHECK_URL unset; the deploy is unverified."
