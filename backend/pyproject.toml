[project]
name = "askgrey-backend"
version = "0.1.0"
description = "askgrey.ai research agent workspace — API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    # Pinned directly rather than left to fastapi's floor: the advisories fixed in 1.1.0-1.3.1
    # (PYSEC-2026-248/249/2280/2281) are what this pin exists to stay ahead of.
    "starlette==1.4.1",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    # PyJWT replaces python-jose: python-jose's latest release still carries an unfixed advisory
    # (PYSEC-2025-185) and it drags in the vulnerable `ecdsa` package.
    "pyjwt==2.13.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.32",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    # pdfplumber's own floor allows the versions with PYSEC-2026-1761/1762.
    "pdfminer.six>=20251230",
    "openpyxl==3.1.5",
    "sentry-sdk==2.66.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pip-audit==2.9.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.setuptools.package-data]
# The eligibility thresholds are data, not code, and are read from the installed package.
"app.services.grants.eligibility" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
