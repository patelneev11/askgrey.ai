[build]
builder = "nixpacks"

[deploy]
# Migrate before serving: the app no longer creates its own schema outside development, and
# a failed migration must stop the release rather than boot a server against an old schema.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
